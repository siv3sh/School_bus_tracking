<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>School Bus Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="login-view" class="login-wrap">
      <form id="login-form" class="login-card">
        <h1>School Bus Tracker</h1>
        <p class="muted">Sign in with your school account</p>
        <label>Email</label>
        <input id="email" type="email" autocomplete="username" value="parent1@schoolbus.app" />
        <label>Password</label>
        <input id="password" type="password" autocomplete="current-password" value="password123" />
        <p id="login-error" class="error" hidden></p>
        <button id="login-btn" type="submit">Sign in</button>
        <p class="hint">
          parent1@ / driver@ / admin@ schoolbus.app — password123
        </p>
      </form>
    </div>

    <div id="app-view" class="app" hidden>
      <header class="topbar">
        <div>
          <div class="brand">School Bus Tracker</div>
          <div id="who" class="muted"></div>
        </div>
        <button id="logout-btn" class="ghost" type="button">Log out</button>
      </header>
      <nav id="tabs" class="tabs"></nav>
      <main id="main"></main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="./app.js"></script>
  </body>
</html>
