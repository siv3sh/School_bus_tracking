<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>School Bus Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="login-view" class="login-shell">
      <div class="login-panel">
        <div class="login-mark" aria-hidden="true">SB</div>
        <h1>School Bus Tracker</h1>
        <p class="login-lead">Live fleet tracking for schools, drivers, and families.</p>
        <form id="login-form" class="login-form">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="username" value="parent1@schoolbus.app" />
          <label for="password">Password</label>
          <div class="password-row">
            <input
              id="password"
              type="password"
              autocomplete="current-password"
              value="password123"
            />
            <button id="toggle-pass" class="text-btn" type="button">Show</button>
          </div>
          <p id="login-error" class="error" hidden></p>
          <button id="login-btn" class="btn-primary" type="submit">Sign in</button>
        </form>
        <p class="login-foot">Authorized school accounts only.</p>
      </div>
    </div>

    <div id="app-view" class="app-shell" hidden>
      <aside class="sidenav">
        <div class="sidenav-brand">
          <div class="login-mark sm">SB</div>
          <div>
            <div class="brand-name">School Bus Tracker</div>
            <div id="who" class="brand-meta"></div>
          </div>
        </div>
        <nav id="tabs" class="sidenav-tabs"></nav>
        <button id="logout-btn" class="btn-logout" type="button">Log out</button>
      </aside>
      <div class="app-body">
        <header class="topbar">
          <div>
            <div id="page-kicker" class="kicker">Console</div>
            <h2 id="page-title">Overview</h2>
          </div>
          <div id="who-mobile" class="who-mobile"></div>
        </header>
        <main id="main"></main>
      </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="./app.js"></script>
  </body>
</html>
